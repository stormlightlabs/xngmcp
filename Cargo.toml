[package]
name = "xngmcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
build = "build.rs"
repository = "https://github.com/stormlightlabs/xngmcp"
license = "MIT"

[dependencies]
anyhow = "1.0.98"
clap = { version = "4.5.37", features = ["derive"] }
encoding_rs = "0.8.35"
lectito = "0.3.0"
owo-colors = "4.2.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
reqwest = { version = "0.12.15", default-features = false, features = ["brotli", "deflate", "gzip", "json", "rustls-tls", "zstd"] }
rmcp = { version = "2.2.0", default-features = false, features = ["client", "macros", "server", "transport-io"] }
schemars = "1.0.4"
tokio = { version = "1.44.2", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.15", features = ["rt"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
thiserror = "2.0.12"
url = "2.5.4"

[build-dependencies]
clap = { version = "4.5.37", features = ["derive"] }
clap_complete = "4.5.48"
clap_mangen = "0.2.26"

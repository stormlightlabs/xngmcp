name: xngmcp-searxng

services:
  searxng:
    image: docker.io/searxng/searxng:2026.7.18-277d8469c@sha256:800a5e3757df04f59e6bd6c622f15de2edbfa47f5591c5b82d4a8ff3b938a845
    restart: unless-stopped
    depends_on:
      valkey:
        condition: service_healthy
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?Run ./infra/searxng/bootstrap.sh first}
      SEARXNG_VALKEY_URL: valkey://valkey:6379/0
    ports:
      - '127.0.0.1:${SEARXNG_PORT:-8080}:8080'
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', '--proxy=off', 'http://127.0.0.1:8080/healthz']
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

  valkey:
    image: docker.io/valkey/valkey:8.1.9-alpine3.24@sha256:a038175878d66b9d274fbf8be73c0305e93798b83917647f167e18cef3c71eec
    restart: unless-stopped
    command: ['valkey-server', '--appendonly', 'no', '--loglevel', 'warning']
    volumes:
      - valkey-cache:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  valkey-cache:

